name: build

# Actions are pinned to commit hashes (the tag in the comment is what the hash was when
# pinned): a moved or hijacked tag cannot change what runs here. Python packages come from
# requirements-build.txt with exact versions and hashes (--require-hashes).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # ruff over everything, mypy over the package and the entry points (pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        # PySide6 too: mypy checks the Qt window against Qt's own stubs (as test.yml)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        run: python -X utf8 -m unittest discover tests

      - name: Build
        # The console helper first (the Claude Code hook and the journal commands, a folder:
        # it starts three times faster than one file), then the app that carries it, as a
        # folder (the LGPL needs Qt's libraries as files of their own); the folder must stay
        # under 95 MB (about 71 for the app, 19 for the helper). The zip holds the Daykeeper folder itself.
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --noupx --name daykeeper-cli --icon assets/icon.ico --exclude-module tkinter --exclude-module cryptography --exclude-module argon2 --exclude-module PySide6 --exclude-module shiboken6 cli_main.py
          if ($LASTEXITCODE) { exit 1 }
          Set-Content -NoNewline -Encoding ascii dist/daykeeper-cli/build-id.txt "${{ github.sha }}"
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/Daykeeper packaging/daykeeper.spec
          if ($LASTEXITCODE) { exit 1 }
          python packaging/check_size.py dist/Daykeeper 95
          if ($LASTEXITCODE) { exit 1 }
          python -c "import shutil; shutil.make_archive('dist/Daykeeper-win64', 'zip', 'dist', 'Daykeeper')"
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-windows
          path: dist/Daykeeper-win64.zip

  macos:
    needs: lint
    # Apple Silicon build (GitHub's current macOS runners are arm64). The app is not
    # signed: the first start needs "Open Anyway" in Privacy & Security, or the quarantine
    # flag removed (see README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        # the window tests run without a screen (the offscreen platform); a test that hangs stops here with the stacks printed, not at the job's six hours
        timeout-minutes: 15
        run: python -X faulthandler -c "import faulthandler, sys, unittest; faulthandler.dump_traceback_later(600, exit=True); sys.argv = ['unittest', 'discover', '-v', 'tests']; unittest.main(module=None)"

      - name: Build app bundle
        # the spec puts the version from the package and the minimum system (macOS 14, the
        # oldest the PySide6 wheels run on) into Info.plist; the ad-hoc signature covers the
        # whole bundle (no certificate: see README)
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/Daykeeper packaging/daykeeper.spec
          python packaging/check_size.py dist/Daykeeper.app 90  # 78 MB measured on macOS 26 arm64
          codesign --force --deep --sign - dist/Daykeeper.app
          ditto -c -k --sequesterRsrc --keepParent dist/Daykeeper.app dist/Daykeeper-macos.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-macos
          path: dist/Daykeeper-macos.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # the provenance attestation is signed with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          mkdir out
          cp artifacts/Daykeeper-windows/Daykeeper-win64.zip artifacts/Daykeeper-macos/Daykeeper-macos.zip out/
          cd out
          sha256sum Daykeeper-win64.zip Daykeeper-macos.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Provenance
        # a signed statement of which workflow run, commit and inputs built each file; check a
        # download with `gh attestation verify Daykeeper-win64.zip --owner <owner>`. The binaries
        # themselves stay unsigned: a code-signing certificate is not in hand (see README).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/Daykeeper-win64.zip
            out/Daykeeper-macos.zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/Daykeeper-win64.zip
            out/Daykeeper-macos.zip
            out/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: true
          # a tag with a suffix (v1.2.0-beta.1, -rc.1) is a pre-release: marked so on GitHub and
          # never shown as the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
