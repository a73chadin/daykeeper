name: build

# Actions are pinned to commit hashes (the tag in the comment is what the hash was when
# pinned): a moved or hijacked tag cannot change what runs here. Python packages come from
# requirements-build.txt with exact versions and hashes (--require-hashes).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # ruff over everything, mypy over the package and the entry points (pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        # PySide6 too: mypy checks the Qt window against Qt's own stubs (as test.yml)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        run: python -X utf8 -m unittest discover tests

      - name: Build
        # The console helper first (the Claude Code hook and the journal commands, a folder:
        # it starts three times faster than one file), then the app that carries it, as a
        # folder (the LGPL needs Qt's libraries as files of their own); the folder must stay
        # under 95 MB (about 71 for the app, 19 for the helper). The zip holds the Daykeeper folder itself.
        # Values of the run reach the script as variables, never pasted into it.
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --noupx --name daykeeper-cli --icon assets/icon.ico --exclude-module tkinter --exclude-module cryptography --exclude-module argon2 --exclude-module PySide6 --exclude-module shiboken6 cli_main.py
          if ($LASTEXITCODE) { exit 1 }
          Set-Content -NoNewline -Encoding ascii dist/daykeeper-cli/build-id.txt $env:BUILD_SHA
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/Daykeeper packaging/daykeeper.spec
          if ($LASTEXITCODE) { exit 1 }
          python packaging/check_size.py dist/Daykeeper 95
          if ($LASTEXITCODE) { exit 1 }
          python -c "import shutil; shutil.make_archive('dist/Daykeeper-win64', 'zip', 'dist', 'Daykeeper')"
          if ($LASTEXITCODE) { exit 1 }

      - name: Installer
        # Daykeeper-<version>-setup.exe from the same folder (packaging/daykeeper.iss: per
        # user, no administrator rights). Inno Setup comes with the runner image; choco
        # installs it only when it is not there. A tag must name the version the package
        # carries: the app's update looks for the setup by the tag's version. The tag name
        # reaches the script as a variable, never pasted into it (a tag name is chosen by
        # whoever pushes it). Inno Setup from choco is pinned to one version.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INNOSETUP_VERSION: "6.4.3"
        run: |
          $version = python -c "import daykeeper; print(daykeeper.__version__)"
          if ($LASTEXITCODE) { exit 1 }
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -ne "v$version") { Write-Error "the tag $env:REF_NAME does not match the version $version in daykeeper/__init__.py"; exit 1 }
          $numeric = $version.Split('-')[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          if (-not $iscc) {
            choco install innosetup --version $env:INNOSETUP_VERSION -y --no-progress
            if ($LASTEXITCODE) { exit 1 }
            $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          & $iscc /Q "/DAppVersion=$version" "/DAppNumericVersion=$numeric" "/DSourceDir=$PWD\dist\Daykeeper" "/O$PWD\dist" packaging\daykeeper.iss
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "dist\Daykeeper-$version-setup.exe")) { exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-windows
          path: |
            dist/Daykeeper-win64.zip
            dist/Daykeeper-*-setup.exe

  macos:
    needs: lint
    # Apple Silicon build (GitHub's current macOS runners are arm64). The app is not
    # signed: the first start needs "Open Anyway" in Privacy & Security, or the quarantine
    # flag removed (see README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        # the window tests run without a screen (the offscreen platform); a test that hangs stops here with the stacks printed, not at the job's six hours
        timeout-minutes: 15
        run: python -X faulthandler -c "import faulthandler, sys, unittest; faulthandler.dump_traceback_later(600, exit=True); sys.argv = ['unittest', 'discover', '-v', 'tests']; unittest.main(module=None)"

      - name: Build app bundle
        # the spec puts the version from the package and the minimum system (macOS 14, the
        # oldest the PySide6 wheels run on) into Info.plist; the ad-hoc signature covers the
        # whole bundle (no certificate: see README)
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/Daykeeper packaging/daykeeper.spec
          python packaging/check_size.py dist/Daykeeper.app 90  # 78 MB measured on macOS 26 arm64
          codesign --force --deep --sign - dist/Daykeeper.app
          ditto -c -k --sequesterRsrc --keepParent dist/Daykeeper.app dist/Daykeeper-macos.zip

      - name: Disk image
        # Daykeeper-<version>.dmg: the app and a link to Applications to drag it onto
        run: |
          version=$(python -c "import daykeeper; print(daykeeper.__version__)")
          mkdir dmg
          ditto dist/Daykeeper.app dmg/Daykeeper.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Daykeeper -srcfolder dmg -ov -format UDZO "dist/Daykeeper-$version.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-macos
          path: |
            dist/Daykeeper-macos.zip
            dist/Daykeeper-*.dmg

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # the provenance attestation is signed with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Checksums
        # the first line names the release ("# daykeeper v2.1.0") and is signed with the
        # rest: the app refuses a list whose line is not the tag it is offered under, so an
        # older signed release (its zips carry no version in their names) cannot be
        # replayed as a newer one
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir out
          cp artifacts/Daykeeper-windows/Daykeeper-win64.zip artifacts/Daykeeper-windows/Daykeeper-*-setup.exe out/
          cp artifacts/Daykeeper-macos/Daykeeper-macos.zip artifacts/Daykeeper-macos/Daykeeper-*.dmg out/
          cd out
          { printf '# daykeeper %s\n' "$REF_NAME"; sha256sum Daykeeper-win64.zip Daykeeper-*-setup.exe Daykeeper-macos.zip Daykeeper-*.dmg; } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install the signing tool
        run: python -m pip install --require-hashes -r packaging/requirements-sign.txt

      - name: Sign the checksums
        # SHA256SUMS.txt.sig: the Ed25519 signature the app's update checks before it trusts
        # the list (daykeeper/update.py). The key reaches the script only through this
        # environment variable; the script never prints or writes it, fails when it is
        # missing, and checks the signature with the public key the app carries.
        env:
          DAYKEEPER_SIGNING_KEY: ${{ secrets.DAYKEEPER_SIGNING_KEY }}
        run: python tools/sign_release.py out/SHA256SUMS.txt

      - name: Provenance
        # a signed statement of which workflow run, commit and inputs built each file; check a
        # download with `gh attestation verify Daykeeper-win64.zip --owner <owner>`. The binaries
        # themselves stay unsigned: a code-signing certificate is not in hand (see README).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/Daykeeper-win64.zip
            out/Daykeeper-*-setup.exe
            out/Daykeeper-macos.zip
            out/Daykeeper-*.dmg

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/Daykeeper-win64.zip
            out/Daykeeper-*-setup.exe
            out/Daykeeper-macos.zip
            out/Daykeeper-*.dmg
            out/SHA256SUMS.txt
            out/SHA256SUMS.txt.sig
          body_path: CHANGELOG.md
          generate_release_notes: true
          # a tag with a suffix (v1.2.0-beta.1, -rc.1) is a pre-release: marked so on GitHub and
          # never shown as the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
