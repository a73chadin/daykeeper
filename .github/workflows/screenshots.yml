name: screenshots

# The app on macOS, photographed: the unlock screens, every tab and every settings section
# on a sample vault, light and dark. Started by hand (Actions → screenshots → Run
# workflow); the pictures come as the artifact "screenshots-macos".

on:
  workflow_dispatch:
    inputs:
      language:
        description: "UI language"
        type: choice
        options: [ru, en]
        default: ru

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Screenshots
        # the input reaches the shell as a variable, never pasted into the script
        env:
          LANGUAGE_INPUT: ${{ inputs.language }}
        run: |
          python -X faulthandler tools/screenshots.py shots light "$LANGUAGE_INPUT"
          python -X faulthandler tools/screenshots.py shots dark "$LANGUAGE_INPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-macos
          path: shots/
