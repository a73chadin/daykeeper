name: test

# Every push and pull request (Dependabot's included): lint, types, the dependency audit
# and the tests on Linux and Windows, the window's too: they run without a screen (the
# offscreen platform of Qt). The release build lives in build.yml. Actions are pinned to
# commit hashes, as there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        # PySide6 too: mypy checks the Qt window against Qt's own type stubs, as on a
        # developer's machine (without them every Qt type is Any and the needed ignores
        # turn into "unused ignore" errors)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Dependency audit
        # the pinned build set against the vulnerability databases; a finding fails the job
        run: python -m pip_audit --require-hashes -r requirements-build.txt

  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        # the libraries Qt's GUI module links against even without a screen, then the pinned
        # build set (it brings PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements-dev.txt

      - name: Tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 -m unittest discover tests

  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install
        # the pinned build set first: it brings PySide6 (the window's tests run without a
        # screen, the offscreen platform)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install -r requirements-dev.txt

      - name: Tests
        timeout-minutes: 15
        run: python -X utf8 -m unittest discover tests
